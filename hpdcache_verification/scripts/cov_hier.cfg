## ----------------------------------------------------------------------------
## Coverage Hierarchy Configuration for HPDcache Verification
## ----------------------------------------------------------------------------
## This file defines the coverage collection hierarchy for VCS
## 
## Syntax:
##   +tree <module_name>    - Include module and all its children
##   -tree <module_name>    - Exclude module and all its children
##   +module <module_name>  - Include only this module (not children)
##   -module <module_name>  - Exclude only this module (not children)
## ----------------------------------------------------------------------------

## Include the DUT (top-level hpdcache)
+tree top.i_hpdcache

## Exclude testbench components from coverage
-tree top.i_axi_slave
-tree top.dram_mon

## Exclude behavioral SRAM models
-tree hpdcache_sram_wbyteenable_1rw
-tree hpdcache_sram_1rw
-tree hpdcache_sram_wmask_1rw

## Exclude assertion modules (collect assertion coverage separately)
-module hpdcache_sva
-module hpdcache_plru_sva
-module hpdcache_rrarb_sva
-module hpdcache_fxarb_sva

