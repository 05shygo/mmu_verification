## ----------------------------------------------------------------------------
## Coverage Hierarchy Configuration for MMU Verification
## ----------------------------------------------------------------------------
## This file defines the coverage collection hierarchy for VCS/URG.
##
## Syntax:
##   +tree <module_name>    - Include module and all its children
##   -tree <module_name>    - Exclude module and all its children
##   +module <module_name>  - Include only this module (not children)
##   -module <module_name>  - Exclude only this module (not children)
## ----------------------------------------------------------------------------

## Collect coverage from the full simulation top so UVM/testbench functional
## covergroups (for example mmu_env_cg_whitebox Phase12 CGs) are retained.
## Keeping DUT-only scope here can zero-out covergroup percentage in URG.
+tree tb_top

## Assertion modules are reported separately from DUT code coverage.
-module mmu_sva
-module mmu_arb_sva
-module mmu_l2tlb_rrpv_sva
-module mmu_plru_sva
-module mmu_dplru_sva
-module credit_sva
